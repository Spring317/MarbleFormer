# ============================================================================
# VADASR — Gated Early Exit Model Configuration
# MarbleNet (VAD) + QuartzNet (ASR) with CTC Decoder
# ============================================================================

# --- Audio Feature Extraction ---
features:
  sample_rate: 16000
  n_mels: 80
  n_fft: 512
  hop_length: 160
  win_length: 400
  fmin: 0.0
  fmax: 8000.0
  normalize: true

# --- MarbleNet Encoder (VAD front-end) ---
marblenet:
  num_blocks: 3          # B in MarbleNet-BxRxC
  num_sub_blocks: 2      # R
  num_channels: 64       # C
  kernel_sizes: [11, 13, 15]  # per-block kernel size
  prologue_channels: 128
  prologue_kernel: 11
  epilogue_channels: [64, 128, 128]
  epilogue_kernels: [29, 1, 1]
  dropout: 0.1
  input_channels: 80     # n_mels

# --- VAD Gate ---
gate:
  hidden_dim: 128
  threshold: 0.5         # inference-time decision boundary
  temperature: 1.0       # sigmoid temperature scaling

# --- QuartzNet Encoder (ASR back-end) ---
quartznet:
  input_channels: 128
  num_sub_blocks: 5
  channels: [256, 256, 512, 512, 512]
  kernel_sizes: [33, 39, 51, 63, 75]
  epilogue_channels: [512, 1024]
  epilogue_kernels: [87, 1]
  dropout: 0.1

# --- CTC Head ---
ctc:
  # vocab_size is set dynamically from tokenizer
  blank_id: 0            # CTC blank token index
  add_blank: true

# --- Tokenizer ---
tokenizer:
  type: "sentencepiece"
  model_path: "data/bpe_4000/bpe.model"  # reuse existing BPE model
  vocab_size: 4000

# --- Dataset ---
data:
  # Local BUD500 dataset (already downloaded — no re-download)
  bud500_local_dir: "/home/datasets/viet_bud500"        # root dir with train/ and test/ subdirs

  # Background noise data
  noise_dir: "/home/datasets/background_noise"             # raw Freesound downloads (any format)
  noise_resampled_dir: "/home/datasets/background_noise_resampled"  # resampled 16kHz mono WAV
  noise_manifest: "/home/datasets/manifest/noise.jsonl"
  public_datasets_download_dir: "/home/datasets/public_datasets_raw"
  public_datasets_noise_dir: "/home/datasets/public_datasets_noise"
  synthetic_noise_dir: "/home/datasets/synthetic_noise"

  # Manifest output
  manifest_dir: "/home/datasets/data/manifest"

  speech_noise_ratio: 0.7   # 70% speech, 30% noise per epoch
  max_audio_len_sec: 12.0
  min_audio_len_sec: 0.5
  num_workers: 8
  pin_memory: true

# --- Augmentation ---
augmentation:
  enabled: true
  speed_perturb:
    enabled: true
    rates: [0.9, 0.95, 1.0, 1.05, 1.1]
  spec_augment:
    enabled: true
    freq_masks: 2
    freq_mask_width: 27
    time_masks: 10
    time_mask_width: 0.05   # fraction of total time
  noise_mix:
    enabled: true
    snr_range: [5, 20]      # dB

# --- Training ---
training:
  batch_size: 32
  gradient_accumulation_steps: 4
  max_epochs: 100
  learning_rate: 0.0005            # halved from 0.001 for stability
  weight_decay: 0.0001
  max_grad_norm: 1.0               # tighter clipping (was 5.0) prevents gradient explosion
  use_amp: true
  seed: 42

  # Separate LR scaling for VAD branch (MarbleNet + Gate)
  # VAD converges much faster (~300K params vs ~18M QuartzNet)
  vad_lr_scale: 0.1                # VAD branch gets LR * 0.1

  # Loss weights
  lambda_vad: 1.0
  lambda_ctc: 1.0

  # CTC reduction (match NeMo)
  ctc_reduction: "mean_batch"

  # Warmup + Cosine Annealing
  warmup_steps: 2500               # longer warmup (was 1000) for training stability
  min_lr: 0.00001

  # NaN safety
  max_nan_batches_per_epoch: 50    # abort epoch if too many NaN batches

  # Checkpointing
  checkpoint_dir: "checkpoints"
  save_every_n_epochs: 5
  keep_top_k: 3            # keep top-K best checkpoints by val WER

  # Early stopping
  patience: 10
  monitor_metric: "val_wer"
  monitor_mode: "min"

# --- Evaluation ---
evaluation:
  batch_size: 32
  gate_threshold_search: true
  threshold_range: [0.3, 0.7]
